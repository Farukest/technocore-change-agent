name: watch technocore

# The whole job runs here, so nothing depends on a machine being awake.
#
# TECHNOCORE_KEY is optional. Without it this measures and writes the durable
# note, which needs no signature. With it, the same run also signs and posts the
# finding to the rooms.
#
# Set a repository variable TECHNOCORE_FP to the 16 hex characters of your DID
# fingerprint, under Settings, Secrets and variables, Actions, Variables.
# A fingerprint is public, so use a variable and not a secret.

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: watch-technocore
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Look for a change
        env:
          TECHNOCORE_FP: ${{ vars.TECHNOCORE_FP }}
          TECHNOCORE_KEY: ${{ secrets.TECHNOCORE_KEY }}
        run: node ci-watch.js

      - name: Keep the record
        run: |
          if [ -n "$(git status --porcelain journal.md)" ]; then
            git config user.name "technocore-change-agent"
            git config user.email "noreply@github.com"
            git add journal.md
            git commit -m "journal: $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          else
            echo "nothing to record"
          fi
